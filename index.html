<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx_RBBTGiCE9demgpqkmvIyAA1vu_3PBAKqVuU7TjbbOiVf-CmmL0sO9dKTRQIP_pYB/exec'; 
    // Subimos a 2 minutos para proteger la cuotas de Google Apps Script
    const TIEMPO_REFRESCO_MS = 120000; 

    let todosLosDatos = [];
    let diaSeleccionado = 'TODOS';
    let categoriaSeleccionada = 'TODAS';

    function normalizarTexto(txt) {
        if (!txt) return "";
        return String(txt)
            .toUpperCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
    }

    function esMarcaTemporal(nombreColumna) {
        if (!nombreColumna) return false;
        const col = normalizarTexto(nombreColumna);
        return col.includes("MARCA") || col.includes("TEMPORAL") || col.includes("TIMESTAMP") || col.includes("FECHA") || col.includes("REGISTRO");
    }

    function esColumnaCategoria(nombreColumna) {
        if (!nombreColumna) return false;
        const col = normalizarTexto(nombreColumna);
        return col.includes("CATEGORIA") || col.includes("CATEGORÍA");
    }

    function mostrarEstado(mensaje, esError = false) {
        const divEstado = document.getElementById('estado');
        if (!mensaje) {
            divEstado.classList.add('oculto');
            divEstado.classList.remove('cargando');
        } else {
            divEstado.textContent = mensaje;
            divEstado.classList.remove('oculto');
            if (esError) {
                divEstado.classList.remove('cargando');
                divEstado.style.color = '#ff6b6b';
            } else {
                divEstado.classList.add('cargando');
                divEstado.style.color = '#ffffff';
            }
        }
    }

    async function fetchConTimeout(resource, options = {}) {
        const { timeout = 8000 } = options;
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);

        const response = await fetch(resource, {
            ...options,
            signal: controller.signal
        });
        clearTimeout(id);
        return response;
    }

    async function cargarDatos() {
        // Carga rápida desde caché si existe
        const datosCache = localStorage.getItem('vsd_resultados_cache');
        if (datosCache && todosLosDatos.length === 0) {
            try {
                todosLosDatos = JSON.parse(datosCache);
                renderizarTabla();
                mostrarEstado(null);
            } catch (e) {
                console.warn('Error leyendo caché local');
            }
        }

        if (todosLosDatos.length === 0) {
            mostrarEstado('Cargando resultados...');
        }

        try {
            const cacheBusterUrl = `${WEB_APP_URL}?t=${new Date().getTime()}`;
            const response = await fetchConTimeout(cacheBusterUrl, { timeout: 10000 });
            const datos = await response.json();

            if (!datos || datos.length === 0) {
                if (todosLosDatos.length === 0) {
                    mostrarEstado('No hay datos disponibles en la planilla.', true);
                }
                return;
            }

            // Guardar en caché local y actualizar memoria
            todosLosDatos = datos;
            localStorage.setItem('vsd_resultados_cache', JSON.stringify(datos));
            
            mostrarEstado(null);
            renderizarTabla();

        } catch (error) {
            console.error('Error al obtener datos:', error);
            // Si falla pero tenemos datos cargados previa o mediante caché, mantenemos la tabla limpia
            if (todosLosDatos.length > 0) {
                mostrarEstado(null);
            } else {
                mostrarEstado('Error de conexión. Intentando reconectar...', true);
            }
        }
    }

    function filtrarPorDia(dia) {
        diaSeleccionado = dia;
        document.querySelectorAll('.btn-dia').forEach(btn => {
            if (normalizarTexto(btn.textContent).includes(normalizarTexto(dia))) {
                btn.classList.add('activo');
            } else {
                btn.classList.remove('activo');
            }
        });
        renderizarTabla();
    }

    function filtrarPorCategoria(cat) {
        categoriaSeleccionada = cat;
        renderizarTabla();
    }

    function parsearFechaLatino(fechaStr) {
        if (!fechaStr) return null;
        const str = String(fechaStr).trim();

        const coincidenciaFormato = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
        if (coincidenciaFormato) {
            const dia = parseInt(coincidenciaFormato[1], 10);
            const mes = parseInt(coincidenciaFormato[2], 10) - 1; 
            let anio = parseInt(coincidenciaFormato[3], 10);
            if (anio < 100) anio += 2000;
            const fechaLocal = new Date(anio, mes, dia);
            if (!isNaN(fechaLocal.getTime())) return fechaLocal;
        }

        const coincidenciaISO = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
        if (coincidenciaISO) {
            const anio = parseInt(coincidenciaISO[1], 10);
            const mes = parseInt(coincidenciaISO[2], 10) - 1;
            const dia = parseInt(coincidenciaISO[3], 10);
            const fechaLocal = new Date(anio, mes, dia);
            if (!isNaN(fechaLocal.getTime())) return fechaLocal;
        }

        const fNativa = new Date(str);
        if (!isNaN(fNativa.getTime())) return fNativa;

        return null;
    }

    // RENDERIZADO OPTIMIZADO (Sin reflows continuos)
    function renderizarTabla() {
        const headersRow = document.getElementById('headers');
        const cuerpoTabla = document.getElementById('cuerpo-tabla');

        if (todosLosDatos.length === 0) {
            headersRow.innerHTML = '';
            cuerpoTabla.innerHTML = '';
            return;
        }

        const primerObjeto = todosLosDatos[0];
        const keys = Object.keys(primerObjeto);
        const keyMarcaTemporal = keys.find(k => esMarcaTemporal(k)) || keys[0];
        const keyCategoria = keys.find(k => esColumnaCategoria(k));

        const encabezadosVisibles = keys.filter(key => key !== keyMarcaTemporal && !esMarcaTemporal(key));

        // Construcción rápida de headers en HTML string
        headersRow.innerHTML = encabezadosVisibles.map(h => `<th>${h}</th>`).join('');

        const diaBusqueda = normalizarTexto(diaSeleccionado);
        const catBusqueda = normalizarTexto(categoriaSeleccionada);
        
        const datosFiltrados = todosLosDatos.filter(fila => {
            if (catBusqueda !== 'TODAS' && keyCategoria) {
                const valorCatFila = normalizarTexto(fila[keyCategoria]);
                if (!valorCatFila.includes(catBusqueda)) return false;
            }

            if (diaBusqueda === 'TODOS') return true;

            const valorMarca = fila[keyMarcaTemporal];
            if (!valorMarca) return false;

            const txtNorm = normalizarTexto(valorMarca);
            if (diaBusqueda === "JUEVES" && (txtNorm.includes("JUEVES") || txtNorm.includes("JUE"))) return true;
            if (diaBusqueda === "VIERNES" && (txtNorm.includes("VIERNES") || txtNorm.includes("VIE"))) return true;
            if (diaBusqueda === "SABADO" && (txtNorm.includes("SABADO") || txtNorm.includes("SÁBADO") || txtNorm.includes("SAB"))) return true;
            if (diaBusqueda === "DOMINGO" && (txtNorm.includes("DOMINGO") || txtNorm.includes("DOM"))) return true;

            const fecha = parsearFechaLatino(valorMarca);
            if (fecha) {
                const numDia = fecha.getDay(); 
                if (diaBusqueda === 'JUEVES' && numDia === 4) return true;
                if (diaBusqueda === 'VIERNES' && numDia === 5) return true;
                if (diaBusqueda === 'SABADO' && numDia === 6) return true;
                if (diaBusqueda === 'DOMINGO' && numDia === 0) return true;
            }

            return false;
        });

        if (datosFiltrados.length === 0) {
            cuerpoTabla.innerHTML = `<tr><td colspan="${encabezadosVisibles.length}">No hay partidos registrados para los filtros seleccionados.</td></tr>`;
            return;
        }

        // Ensamblado en memoria del cuerpo completo de la tabla
        let HTMLFilas = '';

        datosFiltrados.forEach(fila => {
            const analisisGanador = obtenerGanadorEspecifico(fila, encabezadosVisibles);
            let celdasHTML = '';

            encabezadosVisibles.forEach(header => {
                let valor = (fila[header] !== undefined && fila[header] !== null && fila[header] !== "") ? fila[header] : "-";
                const headerUpper = normalizarTexto(header);
                const esPuntos = headerUpper.includes('PUNTOS') || headerUpper.includes('SCORE') || headerUpper.includes('GOLES') || headerUpper.includes('RESULTADO');

                let contenidoTd = valor;

                if (analisisGanador.ganadorHeader && analisisGanador.ganadorHeader === header && valor !== "-") {
                    contenidoTd = `<span class="equipo-ganador">🏆 ${valor}</span>`;
                } 
                else if (analisisGanador.puntosGanadorHeader && header === analisisGanador.puntosGanadorHeader && valor !== "-") {
                    contenidoTd = `<span class="badge-puntos puntos-ganadores">${valor}</span>`;
                } 
                else if (esPuntos && valor !== "-") {
                    contenidoTd = `<span class="badge-puntos">${valor}</span>`;
                }

                celdasHTML += `<td data-label="${header}">${contenidoTd}</td>`;
            });

            HTMLFilas += `<tr>${celdasHTML}</tr>`;
        });

        // Única inserción masiva al DOM
        cuerpoTabla.innerHTML = HTMLFilas;
    }

    function obtenerGanadorEspecifico(fila, encabezados) {
        let club1Header = null, puntos1 = null, puntos1Header = null;
        let club2Header = null, puntos2 = null, puntos2Header = null;

        encabezados.forEach(h => {
            const name = normalizarTexto(h);
            if (name.includes('CLUB 1') || name.includes('EQUIPO 1') || name.includes('LOCAL')) {
                if (name.includes('PUNTOS') || name.includes('GOLES') || name.includes('SCORE')) {
                    puntos1 = parseInt(fila[h], 10);
                    puntos1Header = h;
                } else {
                    club1Header = h;
                }
            } else if (name.includes('CLUB 2') || name.includes('EQUIPO 2') || name.includes('VISITANTE')) {
                if (name.includes('PUNTOS') || name.includes('GOLES') || name.includes('SCORE')) {
                    puntos2 = parseInt(fila[h], 10);
                    puntos2Header = h;
                } else {
                    club2Header = h;
                }
            }
        });

        if (!isNaN(puntos1) && !isNaN(puntos2)) {
            if (puntos1 > puntos2) {
                return { ganadorHeader: club1Header, puntosGanadorHeader: puntos1Header };
            } else if (puntos2 > puntos1) {
                return { ganadorHeader: club2Header, puntosGanadorHeader: puntos2Header };
            }
        }

        return { ganadorHeader: null, puntosGanadorHeader: null };
    }

    cargarDatos();
    setInterval(cargarDatos, TIEMPO_REFRESCO_MS);
</script>
